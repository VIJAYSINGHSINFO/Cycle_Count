# Builds everything whenever you change the code, or when you click "Run workflow" on the Actions tab:
#  - the website (console + mobile web app) on GitHub Pages
#  - the Android app (APK), downloadable from the run's Artifacts section
name: Build Stowra

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Write database connection
        run: node scripts/write-config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Build site
        run: |
          npm install --no-save qrcode@1
          node scripts/build-site.js
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          PRIVACY_EMAIL: ${{ vars.PRIVACY_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Write database connection
        run: node scripts/write-config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Prepare Android project
        working-directory: mobile
        run: |
          npm install
          if [ -n "${{ vars.APP_ID }}" ]; then node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.appId='${{ vars.APP_ID }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"; fi
          npx cap add android
          node scripts/patch-android.js
          npx capacitor-assets generate --android || echo "Icon generation skipped"
          npx cap sync android
      - name: Load signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          CC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Spaces, line breaks and quotes picked up while copy-pasting are removed before decoding
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t"' > "$RUNNER_TEMP/key.b64"
          echo "Signing key text: $(wc -c < "$RUNNER_TEMP/key.b64") characters (the correct key is 3404)"
          if ! base64 -d "$RUNNER_TEMP/key.b64" > "$RUNNER_TEMP/release.keystore" 2>/dev/null; then
            echo "::error::The secret ANDROID_KEYSTORE_BASE64 isn't a valid key. Open keystore-base64.txt, press Ctrl+A then Ctrl+C, and paste it again into the secret (Settings > Secrets and variables > Actions > ANDROID_KEYSTORE_BASE64 > Update)."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$CC_KEYSTORE_PASSWORD" -alias "$CC_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The key was read, but the password or alias doesn't match. Check the secrets ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD (same password) and ANDROID_KEY_ALIAS (stowra)."
            exit 1
          fi
          echo "Signing key OK"
      - name: Build APK
        working-directory: mobile/android
        env:
          CC_VERSION_CODE: ${{ github.run_number }}
          CC_VERSION_NAME: 1.0.${{ github.run_number }}
          CC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            export CC_KEYSTORE="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
      - name: Name the files clearly
        run: |
          mkdir -p out
          for f in $(find mobile/android/app/build/outputs -name "*.apk" -o -name "*.aab"); do
            kind=$([ "${f##*.}" = "aab" ] && echo "google-play" || echo "install"); sig=$(echo "$f" | grep -q release && echo "" || echo "-TEST-ONLY")
            cp "$f" "out/stowra-1.0.${{ github.run_number }}-${kind}${sig}.${f##*.}"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: stowra-android-1.0.${{ github.run_number }}
          path: out/*
          if-no-files-found: error
